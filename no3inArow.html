<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Puzzle</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; margin: 20px auto; width: 320px; }
        .cell { width: 100px; height: 100px; background: lightgray; display: flex; align-items: center; justify-content: center; font-size: 2em; cursor: pointer; }
        .cell.occupied { pointer-events: none; background: darkgray; }
        #message { font-size: 1.2em; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Tic-Tac-Toe Puzzle</h1>
    <div class="grid" id="grid"></div>
    <div id="message"></div>
    <script>
        const grid = document.getElementById("grid");
        const message = document.getElementById("message");
        let placedPieces = 0;
        // Correctly create a fresh 2-D array where every row is independent
        const board = Array.from({ length: 3 }, () => Array(3).fill(null));
        
        function checkLoss() {
            for (let i = 0; i < 3; i++) {
                if (board[i][0] && board[i][0] === board[i][1] && board[i][1] === board[i][2]) return true;
                if (board[0][i] && board[0][i] === board[1][i] && board[1][i] === board[2][i]) return true;
            }
            if (board[0][0] && board[0][0] === board[1][1] && board[1][1] === board[2][2]) return true;
            if (board[0][2] && board[0][2] === board[1][1] && board[1][1] === board[2][0]) return true;
            return false;
        }
        
        // Helper to finish the game and free resources
        function endGame(resultMessage) {
            message.textContent = resultMessage;
            // Disable further interaction and remove listeners to avoid memory leaks
            Array.from(grid.children).forEach(c => c.removeEventListener("click", handleClick));
        }

        function handleClick(event) {
            const cell = event.currentTarget;
            const row = parseInt(cell.dataset.row, 10);
            const col = parseInt(cell.dataset.col, 10);
            
            if (!board[row][col]) {
                board[row][col] = "X";
                cell.textContent = "X";
                cell.classList.add("occupied");
                placedPieces++;
                
                if (checkLoss()) {
                    endGame("You Lose! Three in a row!");
                    return;
                }
                
                if (placedPieces === 6) {
                    endGame("You Win! No three in a row!");
                }
            }
        }
        
        for (let i = 0; i < 9; i++) {
            const cell = document.createElement("div");
            cell.classList.add("cell");
            // Pre-compute and store grid coordinates to avoid O(n) search on every click
            cell.dataset.row = Math.floor(i / 3);
            cell.dataset.col = i % 3;
            cell.addEventListener("click", handleClick);
            grid.appendChild(cell);
        }
    </script>
</body>
</html>
